apiVersion: v1
kind: ConfigMap
metadata:
  name: jina-adapter-script-fp32
  namespace: default
data:
  proxy.py: |
    import asyncio
    import json
    import sys
    import aiohttp
    from aiohttp import web

    VLLM_URL = "http://127.0.0.1:8001"
    MODEL_NAME = "jinaai/jina-embeddings-v2-small-en"
    MAX_PIPELINED_BATCHES = 2
    MAX_COALESCE_SIZE = 24
    COALESCE_WINDOW_S = 0.0008

    class AdaptiveMicroBatcher:
        def __init__(self, session: aiohttp.ClientSession):
            self.session = session
            self.queue = []
            self.in_flight = 0
            self.trigger_event = asyncio.Event()
            self.worker_tasks = [
                asyncio.create_task(self._batch_worker(i))
                for i in range(MAX_PIPELINED_BATCHES)
            ]

        async def submit_single(self, text: str) -> tuple[bytes, int]:
            if self.in_flight == 0 and not self.queue:
                self.in_flight += 1
                try:
                    payload = {
                        "model": MODEL_NAME,
                        "input": text,
                        "truncate_prompt_tokens": 2048,
                    }
                    async with self.session.post(
                        f"{VLLM_URL}/v1/embeddings", json=payload
                    ) as resp:
                        body = await resp.read()
                        return body, resp.status
                finally:
                    self.in_flight -= 1
                    if self.queue:
                        self.trigger_event.set()

            loop = asyncio.get_running_loop()
            fut = loop.create_future()
            self.queue.append((text, fut))
            self.trigger_event.set()
            return await fut

        async def _batch_worker(self, worker_id: int):
            while True:
                if not self.queue:
                    self.trigger_event.clear()
                    await self.trigger_event.wait()
                if not self.queue:
                    continue

                if len(self.queue) < 8 and self.in_flight > 0:
                    await asyncio.sleep(COALESCE_WINDOW_S)

                if not self.queue:
                    continue

                batch = self.queue[:MAX_COALESCE_SIZE]
                del self.queue[:MAX_COALESCE_SIZE]
                if self.queue:
                    self.trigger_event.set()

                self.in_flight += 1
                try:
                    if len(batch) == 1:
                        text, fut = batch[0]
                        payload = {
                            "model": MODEL_NAME,
                            "input": text,
                            "truncate_prompt_tokens": 2048,
                        }
                        async with self.session.post(
                            f"{VLLM_URL}/v1/embeddings", json=payload
                        ) as resp:
                            body = await resp.read()
                            if not fut.done():
                                fut.set_result((body, resp.status))
                    else:
                        texts = [item[0] for item in batch]
                        payload = {
                            "model": MODEL_NAME,
                            "input": texts,
                            "truncate_prompt_tokens": 2048,
                        }
                        async with self.session.post(
                            f"{VLLM_URL}/v1/embeddings", json=payload
                        ) as resp:
                            status = resp.status
                            if status == 200:
                                resp_json = await resp.json()
                                data_list = resp_json.get("data", [])
                                usage = resp_json.get("usage", {})
                                for idx, (_, fut) in enumerate(batch):
                                    if not fut.done():
                                        item_data = (
                                            [data_list[idx]]
                                            if idx < len(data_list)
                                            else []
                                        )
                                        single_resp = json.dumps({
                                            "object": "list",
                                            "data": item_data,
                                            "model": MODEL_NAME,
                                            "usage": usage,
                                        }).encode("utf-8")
                                        fut.set_result((single_resp, 200))
                            else:
                                body = await resp.read()
                                for _, fut in batch:
                                    if not fut.done():
                                        fut.set_result((body, status))
                except Exception as e:
                    err_bytes = json.dumps({"error": str(e)}).encode("utf-8")
                    for _, fut in batch:
                        if not fut.done():
                            fut.set_result((err_bytes, 500))
                finally:
                    self.in_flight -= 1

        async def close(self):
            for t in self.worker_tasks:
                t.cancel()

    async def init_app():
        app = web.Application(client_max_size=64 * 1024 * 1024)
        session = aiohttp.ClientSession(
            connector=aiohttp.TCPConnector(
                limit=1000, limit_per_host=1000, keepalive_timeout=120
            )
        )
        batcher = AdaptiveMicroBatcher(session)
        app["session"] = session
        app["batcher"] = batcher

        async def handle_prompt(request):
            try:
                data = await request.json()
                text_input = data.get("text", "")
                if isinstance(text_input, str):
                    body, status = await batcher.submit_single(text_input)
                    return web.Response(
                        body=body, status=status, content_type="application/json"
                    )
                else:
                    payload = {
                        "model": MODEL_NAME,
                        "input": text_input,
                        "truncate_prompt_tokens": 2048,
                    }
                    async with session.post(
                        f"{VLLM_URL}/v1/embeddings", json=payload
                    ) as resp:
                        body = await resp.read()
                        return web.Response(
                            body=body,
                            status=resp.status,
                            content_type="application/json",
                        )
            except Exception as e:
                return web.json_response({"error": str(e)}, status=500)

        async def handle_health(request):
            return web.json_response({"status": "ok", "mode": "v6e_fp32_megakernel"})

        async def cleanup(app):
            await app["batcher"].close()
            await app["session"].close()

        app.router.add_post("/prompt_c2", handle_prompt)
        app.router.add_post("/mcp_c2", handle_prompt)
        app.router.add_get("/health", handle_health)
        app.router.add_get("/healthz", handle_health)
        app.on_cleanup.append(cleanup)
        return app

    if __name__ == "__main__":
        port = int(sys.argv[1]) if len(sys.argv) > 1 else 8000
        print(f"Starting TPU v6e Megakernel Adapter Proxy on port {port} -> {VLLM_URL}", flush=True)
        web.run_app(init_app(), host="0.0.0.0", port=port, access_log=None)

  entrypoint.sh: |
    #!/bin/bash
    set -e
    echo "=== [1/5] Installing git and essential build tools ==="
    apt-get update && apt-get install -y git curl build-essential procps

    echo "=== [2/5] Cloning tpu-inference repo (branch: jina-v2-alibi-kernel with 4-Layer Fused Megakernel) ==="
    mkdir -p /workspace && cd /workspace
    if [ ! -d "tpu-inference" ]; then
        git clone https://github.com/pallavim1/tpu-inference.git
    fi
    cd tpu-inference
    git fetch origin
    git checkout jina-v2-alibi-kernel
    git pull origin jina-v2-alibi-kernel

    echo "=== [3/5] Installing vllm-tpu stack and editable Megakernel overlay ==="
    python3 -m pip install --upgrade pip
    python3 -m pip install vllm-tpu==0.26.0
    python3 -m pip install -e .
    python3 -m pip install onnxruntime transformers openpyxl aiohttp

    echo "=== [4/5] Applying Jina environment patches ==="
    python3 scripts/setup_jina_env.py

    echo "=== [5/5] Starting TPU v6e Megakernel Fast-Path Adapter Proxy on port 8000 ==="
    cp /config/proxy.py /workspace/proxy.py
    python3 /workspace/proxy.py 8000 &

    echo "=== [6/6] Launching vLLM Jina Embeddings Server (FP32 Megakernel) on internal port 8001 ==="
    while true; do
        vllm serve jinaai/jina-embeddings-v2-small-en \
            --runner pooling \
            --convert embed \
            --trust-remote-code \
            --max-model-len 2048 \
            --dtype float32 \
            --max-num-seqs=40 \
            --max-num-batched-tokens 8192 \
            --host 127.0.0.1 \
            --port 8001 || true
        echo "vllm serve exited; restarting in 3s..."
        sleep 3
    done
